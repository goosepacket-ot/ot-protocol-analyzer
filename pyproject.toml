[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-protocol-analyzer"
version = "0.1.0"
description = "Passive OT/ICS protocol analyser for PCAP captures — asset inventory, communication matrix and security findings, with zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Laxmikant" }]
keywords = ["OT", "ICS", "SCADA", "Modbus", "DNP3", "IEC-104", "IEC-61850", "PROFINET", "pcap", "network-security", "IEC-62443"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/goosepacket/ot-protocol-analyzer"
Issues = "https://github.com/goosepacket/ot-protocol-analyzer/issues"

[project.scripts]
otpa = "otpa.cli:main"

[tool.setuptools]
packages = ["otpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
